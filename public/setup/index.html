<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner Map - Setup Wizard</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/setup/setup.css" />
</head>
<body>
  <div class="wizard">
    <aside class="wizard-nav">
      <div class="brand">
        <span class="brand-mark">📡</span>
        <div>
          <div class="brand-title">Scanner Map</div>
          <div class="brand-sub">Setup Wizard</div>
        </div>
      </div>
      <ol id="step-nav" class="step-nav"></ol>
      <div class="nav-footer">v2.0 &middot; first-time setup</div>
    </aside>

    <main class="wizard-main">
      <div id="step-container" class="step-container"></div>
      <div class="wizard-actions">
        <button id="btn-back" class="btn btn-ghost" type="button">Back</button>
        <div class="spacer"></div>
        <span id="save-indicator" class="save-indicator"></span>
        <button id="btn-next" class="btn btn-primary" type="button">Next</button>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/setup/setup.js"></script>
</body>
</html>
